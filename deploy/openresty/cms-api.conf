# OpenResty site for the public Strapi API origin on louis.
# Replace server_name and certificate paths before installing.
# Product upload cap is 50 MiB; leave 2 MiB for multipart overhead.
# Access logs must not record request bodies.
# /deploy is separated from the Strapi API upstream (K4F7/cms#10).

log_format cms_api_nobody '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

upstream cms_api {
    server 127.0.0.1:1337;
}

upstream cms_deploy_webhook {
    server 127.0.0.1:9100;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/api.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;

    client_max_body_size 52m;

    access_log /var/log/nginx/cms-api.access.log cms_api_nobody;
    error_log  /var/log/nginx/cms-api.error.log;

    location = /deploy {
        client_max_body_size 32k;
        proxy_pass http://cms_deploy_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Cms-Timestamp $http_x_cms_timestamp;
        proxy_set_header X-Cms-Signature $http_x_cms_signature;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://cms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
