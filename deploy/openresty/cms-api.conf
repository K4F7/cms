# OpenResty site for the public Strapi API origin on louis.
# Replace server_name and certificate paths before installing.
# Product upload cap is 50 MiB; leave 2 MiB for multipart overhead.
# Do not log request bodies. Deployment webhook routing is K4F7/cms#10.

upstream cms_api {
    server 127.0.0.1:1337;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/api.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;

    client_max_body_size 52m;

    access_log /var/log/nginx/cms-api.access.log;
    error_log  /var/log/nginx/cms-api.error.log;

    location / {
        proxy_pass http://cms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
