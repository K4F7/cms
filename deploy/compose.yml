# Strapi API on louis. PostgreSQL stays on the existing 1Panel instance.
# Host networking is required because that Postgres listens on loopback only.
# Production: pull only from GHCR (no on-server build). Dokploy GitHub autoDeploy
# recreates the container; set CMS_IMAGE_TAG=latest (or a git sha).

services:
  api:
    container_name: deploy-api-1
    image: ghcr.io/k4f7/cms:${CMS_IMAGE_TAG:-latest}
    network_mode: host
    env_file: .env
    environment:
      HOST: ${HOST:-127.0.0.1}
      PORT: ${PORT:-1337}
      SERVE_ADMIN_PANEL: "false"
    volumes:
      - ${CMS_MEDIA_PATH:-/opt/cms/media}:/opt/app/public/uploads
    restart: unless-stopped
