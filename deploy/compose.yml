# Strapi API on louis. PostgreSQL stays on the existing 1Panel instance.
# Host networking is required because that Postgres listens on loopback only.
# Production: pull only from GHCR (no on-server build). CI pins CMS_IMAGE_TAG to
# the full git sha and calls Dokploy compose.saveEnvironment + compose.deploy.
# Do not rely on :latest or GitHub→Dokploy autoDeploy for production image swaps.
# CMS_IMAGE_TAG is required (full git sha); there is no default.

services:
  api:
    container_name: deploy-api-1
    image: ghcr.io/k4f7/cms:${CMS_IMAGE_TAG:?CMS_IMAGE_TAG must be set to a full git sha}
    pull_policy: always
    network_mode: host
    env_file: .env
    environment:
      HOST: ${HOST:-127.0.0.1}
      PORT: ${PORT:-1337}
      SERVE_ADMIN_PANEL: "false"
    volumes:
      - ${CMS_MEDIA_PATH:-/opt/cms/media}:/opt/app/public/uploads
    restart: unless-stopped
