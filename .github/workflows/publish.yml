name: publish

# Build/push ghcr.io/k4f7/cms:<git-sha> and :latest; runtime pull is Dokploy (no self-hosted webhook).

on:
  push:
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: npm run test:baseline
        env:
          CI: true
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  publish-api:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image identity
        id: meta
        run: |
          sha="${GITHUB_SHA}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "image_sha=ghcr.io/k4f7/cms:${sha}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/k4f7/cms:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_latest }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

