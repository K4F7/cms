name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: npm run test:baseline
        env:
          CI: true
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
